name: Import Synology DS409 lab screenshots

on:
  push:
    paths:
      - '.github/workflows/import-synology-screenshots.yml'

permissions:
  contents: write

jobs:
  import-screenshots:
    if: github.repository == 'HetmanSoftware/data-recovery-lab'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch screenshots from the published Hetman article
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen, Request

          root = Path("experiments/synology-ds409-raid1-to-raid5-migration-failure")
          names = root.joinpath("SCREENSHOT_MANIFEST.txt").read_text().splitlines()
          directory = root / "images"
          directory.mkdir(parents=True, exist_ok=True)
          base = "https://hetmanrecovery.com/uk/pic/blog/synology-raid1-to-raid5/"
          imported = []
          errors = []

          for name in names:
              if not name.endswith(".png") or Path(name).name != name:
                  raise RuntimeError("Invalid manifest name: " + name)
              try:
                  req = Request(base + name, headers={"User-Agent": "Mozilla/5.0 (Hetman Data Recovery Lab)"})
                  with urlopen(req, timeout=30) as response:
                      data = response.read(10_000_000)
                  if not data.startswith(bytes.fromhex("89504e470d0a1a0a")) or len(data) < 1000:
                      raise ValueError("Response is not PNG")
                  (directory / name).write_bytes(data)
                  imported.append(name)
                  print("Downloaded:", name, len(data), "bytes")
              except Exception as exc:
                  errors.append(f"{name}: {exc}")

          if errors:
              print("\nDownload failures:")
              print("\n".join(errors))
              raise RuntimeError(f"Imported {len(imported)} of {len(names)} screenshots. Fix the source URLs before publishing.")

          print(f"Imported all {len(imported)} screenshots")
          PY

      - name: Commit imported screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/synology-ds409-raid1-to-raid5-migration-failure/images/
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Add original Synology DS409 RAID migration screenshots"
            git push
          fi
